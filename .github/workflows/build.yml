# Rebuilds the site whenever content, templates or styles change, and commits
# the result to docs/ (which GitHub Pages serves). Nothing to configure.
name: Build site

on:
  push:
    branches: [main]
    paths: ["content/**", "templates/**", "static/**", "build.py", "requirements.txt"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python build.py
      - name: Commit the rebuilt site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A docs
          if git diff --cached --quiet; then
            echo "Site unchanged"
          else
            git commit -m "Rebuild site"
            git push
          fi
