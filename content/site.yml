# Research themes (each project file names one of these ids)
themes:
  - id: compressible
    title: Compressible flows and shock waves
    blurb: >-
      How moving shock waves reflect, diffract and recover when they meet area changes,
      constrictions and porous barriers inside ducts, studied in our automated shock tube
      with high-speed schlieren imaging and large-eddy simulation.
  - id: multiphase
    title: Multiphase and index-matched flows
    blurb: >-
      Time-resolved, three-dimensional measurements of solids, bubbles and droplets in
      liquids, made possible by matching the refractive index of the fluid to the walls
      and particles so that four high-speed cameras can see the whole flow at once.

