name: Transient Fluid Mechanics Laboratory
short_name: TFML
url: https://www.tfmltechnion.com
affiliation: Faculty of Mechanical Engineering, Technion – Israel Institute of Technology
tagline: >-
  We study the physics of high-speed transient phenomena in single- and multiphase flows:
  shock waves, cavitation, bubble bursting and interfacial dynamics, where extreme
  acceleration, abrupt phase change or interfacial effects govern what happens next.
description: >-
  The Transient Fluid Mechanics Laboratory at the Technion studies high-speed transient
  phenomena in multiphase flows where extreme acceleration, abrupt phase change or
  interfacial phenomena occur: shock waves, cavitation, bubble bursting and more.
epigraph:
  text: Nothing ever is, everything is becoming.
  source: Plato

